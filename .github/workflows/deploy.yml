name: DEPLOY

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

concurrency:
  group: dplay-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1) (Optional) build sanity check. The Dockerfile can also do the build.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (optional)
        run: ./gradlew -x test clean bootJar

      # 2) Build & Push Docker image (NO secrets baked into image)
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/dplay-server:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/dplay-server:latest

      # 3) Deploy on EC2: write config files from Secrets, pull image, run Blue/Green
      - name: Deploy via SSH with Blue-Green Strategy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          # ✅ 핵심: 기본 10분 → 충분히 늘리기
          command_timeout: 30m
          timeout: 60s

          script: |
            set -Eeuo pipefail

            echo "==[0] START: $(date '+%Y-%m-%d %H:%M:%S')=="
            echo "[env] whoami=$(whoami) host=$(hostname)"

            # Ensure dirs
            echo "==[1] Ensure dirs=="
            mkdir -p /home/ec2-user/app/env

            # Write application-prod.yml from GitHub Secret (mounted into containers)
            echo "==[2] Write application-prod.yml=="
            cat > /home/ec2-user/app/env/application-prod.yml <<'YML'
            ${{ secrets.APP_PROD_YML }}
            YML
            chmod 600 /home/ec2-user/app/env/application-prod.yml

            # Write Apple Music private key file from GitHub Secret (mounted into containers)
            echo "==[3] Write Apple Music private key=="
            cat > /home/ec2-user/app/env/AuthKey_B4ZKW7CJ8U.p8 <<'KEY'
            ${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}
            KEY
            chmod 600 /home/ec2-user/app/env/AuthKey_B4ZKW7CJ8U.p8

            # Quick sanity checks
            echo "==[4] Sanity check config files=="
            ls -al /home/ec2-user/app/env/application-prod.yml /home/ec2-user/app/env/AuthKey_B4ZKW7CJ8U.p8
            head -n 1 /home/ec2-user/app/env/AuthKey_B4ZKW7CJ8U.p8 | sed 's/./*/g' || true

            # DockerHub login (✅ -p 대신 password-stdin)
            echo "==[5] Docker login=="
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Decide Blue/Green
            echo "==[6] Decide Blue/Green=="
            if docker ps --format '{{.Names}}' | grep -q '^dplay-container-blue$'; then
              CURRENT=blue
              NEXT=green
              NEXT_PORT=8082
            else
              CURRENT=green
              NEXT=blue
              NEXT_PORT=8081
            fi
            echo "현재 운영 중: $CURRENT → 새로 띄울 컨테이너: $NEXT (port $NEXT_PORT)"

            # Stop/remove next container if exists
            echo "==[7] Stop/remove NEXT container if exists=="
            docker stop "dplay-container-$NEXT" || true
            docker rm "dplay-container-$NEXT" || true

            # Pull latest image
            echo "==[8] Pull latest image=="
            docker pull "${{ secrets.DOCKER_USERNAME }}/dplay-server:latest"

            # Run next container
            echo "==[9] Run NEXT container=="
            docker run -d \
              -p "$NEXT_PORT:8080" \
              --name "dplay-container-$NEXT" \
              -v /home/ec2-user/app/env/application-prod.yml:/app/application-prod.yml:ro \
              -v /home/ec2-user/app/env/AuthKey_B4ZKW7CJ8U.p8:/app/AuthKey_B4ZKW7CJ8U.p8:ro \
              "${{ secrets.DOCKER_USERNAME }}/dplay-server:latest" \
              --spring.profiles.active=prod \
              --spring.config.location=file:/app/application-prod.yml

            echo "==[10] Show container status=="
            docker ps --filter "name=dplay-container-$NEXT" --no-trunc

            # Health check (✅ 상한 + 실패 시 로그 출력 + path 2종 대응)
            echo "==[11] Health check=="
            HEALTH_OK=0
            for i in $(seq 1 60); do
              # 1) /api/actuator/health
              if curl -fsS "http://localhost:$NEXT_PORT/api/actuator/health" | grep -q '"status"\s*:\s*"UP"'; then
                HEALTH_OK=1
                echo "🟢 health OK: /api/actuator/health"
                break
              fi

              # 2) /actuator/health (혹시 context-path 다를 때)
              if curl -fsS "http://localhost:$NEXT_PORT/actuator/health" | grep -q '"status"\s*:\s*"UP"'; then
                HEALTH_OK=1
                echo "🟢 health OK: /actuator/health"
                break
              fi

              echo "🔁 헬스 체크 중... ($i/60)"
              sleep 2
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "🔴 헬스 체크 실패. 컨테이너 로그 출력 후 종료"
              docker logs --tail 300 "dplay-container-$NEXT" || true
              exit 1
            fi

            # Nginx switch (requires your prepared backup configs)
            echo "==[12] Nginx switch to $NEXT=="
            sudo cp "/etc/nginx/conf.d/backup/api-$NEXT.conf" /etc/nginx/conf.d/api.conf
            sudo nginx -t
            sudo systemctl reload nginx

            # Stop previous container
            echo "==[13] Stop CURRENT container=="
            docker stop "dplay-container-$CURRENT" || true

            echo "==[14] DONE: $(date '+%Y-%m-%d %H:%M:%S')=="
