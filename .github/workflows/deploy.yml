name: DEPLOY

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

concurrency:
  group: dplay-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1) (Optional) build sanity check. The Dockerfile can also do the build.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (optional)
        run: ./gradlew -x test clean bootJar

      # 2) Build & Push Docker image (NO secrets baked into image)
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/dplay-server:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/dplay-server:latest

      # 3) Deploy on EC2: write config files from Secrets, pull image, run Blue/Green
      - name: Deploy via SSH with Blue-Green Strategy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Ensure dirs
            mkdir -p /home/ec2-user/app/env

            # Write application-prod.yml from GitHub Secret (mounted into containers)
            cat > /home/ec2-user/app/env/application-prod.yml <<'YML'
            ${{ secrets.APP_PROD_YML }}
            YML
            chmod 600 /home/ec2-user/app/env/application-prod.yml

            # Write Apple Music private key file from GitHub Secret (mounted into containers)
            cat > /home/ec2-user/app/env/AuthKey_B4ZKW7CJ8U.p8 <<'KEY'
            ${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}
            KEY
            chmod 600 /home/ec2-user/app/env/AuthKey_B4ZKW7CJ8U.p8

            # DockerHub login
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}

            # Decide Blue/Green
            if docker ps | grep -q dplay-container-blue; then
              CURRENT=blue
              NEXT=green
              NEXT_PORT=8082
            else
              CURRENT=green
              NEXT=blue
              NEXT_PORT=8081
            fi

            echo "현재 운영 중: $CURRENT → 새로 띄울 컨테이너: $NEXT (port $NEXT_PORT)"

            # Stop/remove next container if exists
            docker stop dplay-container-$NEXT || true
            docker rm dplay-container-$NEXT || true

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/dplay-server:latest

            # Run next container (mount prod yml + apple key; keep container name)
            docker run -d \
              -p $NEXT_PORT:8080 \
              --name dplay-container-$NEXT \
              -v /home/ec2-user/app/env/application-prod.yml:/app/application-prod.yml:ro \
              -v /home/ec2-user/app/env/AuthKey_B4ZKW7CJ8U.p8:/app/AuthKey_B4ZKW7CJ8U.p8:ro \
              ${{ secrets.DOCKER_USERNAME }}/dplay-server:latest \
              --spring.profiles.active=prod \
              --spring.config.location=file:/app/application-prod.yml

            # Health check (adjust path if needed)
            for i in {1..20}; do
              if curl -s http://localhost:$NEXT_PORT/api/actuator/health | grep -q '"status"\s*:\s*"UP"'; then
                echo "🟢 새 컨테이너 헬스 체크 통과"
                break
              fi
              echo "🔁 헬스 체크 중... ($i/20)"
              sleep 3
            done

            # Nginx switch (requires your prepared backup configs)
            echo "🌐 Nginx 전환: $NEXT"
            sudo cp /etc/nginx/conf.d/backup/api-$NEXT.conf /etc/nginx/conf.d/api.conf
            sudo nginx -t
            sudo systemctl reload nginx

            # Stop previous container
            docker stop dplay-container-$CURRENT || true

            echo "배포 완료 at $(date '+%Y-%m-%d %H:%M:%S')"
